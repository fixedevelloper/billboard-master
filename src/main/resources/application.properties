spring.application.name=billboard

# Actuator : uniquement /actuator/health exposé (healthcheck Docker), rien d'autre (pas de env,
# beans, etc.). Détail des composants (DB, disque...) masqué sans authentification.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# JWT (défini via variable d'environnement / .env : JWT_SECRET, JWT_EXPIRATION_MS)
# Volontairement sans valeur par défaut : un secret par défaut committé dans le code serait
# public, donc forgeable par n'importe qui. Sans JWT_SECRET, le démarrage échoue plutôt que
# de faire tourner l'app avec un secret connu de tous.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Lax}

# Origines autorisées à appeler l'API depuis un navigateur (le frontend Next.js tourne sur :3000)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Datasource MySQL (surchargeable via DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/billboard?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway est la source de vérité du schéma : Hibernate ne doit ni le générer ni le valider
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Mail SMTP (surchargeable via MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD)
# Valeurs par défaut adaptées à un capteur SMTP local de dev (ex. MailHog) sans authentification
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
mail.from=${MAIL_FROM:no-reply@billboard.local}

# Module notification : mêmes identifiants SMTP que ci-dessus (MailConfig y construit son
# propre bean JavaMailSender), plus quelques réglages qui lui sont propres.
app.mail.encryption=${MAIL_ENCRYPTION:}
app.mail.timeout-ms=${MAIL_TIMEOUT_MS:8000}
app.mail.from=${APP_MAIL_FROM:${MAIL_FROM:no-reply@billboard.local}}

# MinIO (surchargeable via MINIO_ENDPOINT, MINIO_ACCESS_KEY, MINIO_SECRET_KEY, MINIO_BUCKET, MINIO_PUBLIC_URL)
storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
storage.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
storage.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
storage.minio.bucket-name=${MINIO_BUCKET:billboard}
storage.minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000/billboard/}

# Expiration automatique des réservations non payées (voir BookingExpirationScheduler) :
# nombre de jours après la création d'une réservation PENDING/CONFIRMED sans paiement
# réussi avant qu'elle ne passe automatiquement au statut EXPIRED.
booking.unpaid-expiration-days=${BOOKING_UNPAID_EXPIRATION_DAYS:7}

# Bootstrap du compte admin par défaut (voir AdminAccountInitializer). Si ADMIN_EMAIL ou
# ADMIN_PASSWORD n'est pas défini, aucun compte n'est créé — pas de valeur par défaut ici
# volontairement, pour ne jamais faire tourner l'app avec un admin à mot de passe prévisible.
admin.bootstrap.email=${ADMIN_EMAIL:}
admin.bootstrap.password=${ADMIN_PASSWORD:}
admin.bootstrap.first-name=${ADMIN_FIRST_NAME:Admin}
admin.bootstrap.last-name=${ADMIN_LAST_NAME:Admin}

# Identifiant réservé du "portefeuille plateforme" (commission prélevée sur chaque paiement de
# réservation, voir booking.RevenueSplitListener). N'importe quel UUID fixe convient : la table
# wallets n'a pas de clé étrangère vers users, c'est juste une clé de regroupement — le
# portefeuille est créé automatiquement au premier crédit.
platform.wallet.user-id=${PLATFORM_WALLET_USER_ID:00000000-0000-0000-0000-000000000001}

# Flutterwave (mode de paiement) : clé secrète + secret hash de webhook depuis le dashboard
# Flutterwave (Settings > API / Settings > Webhooks). Sans FLW_SECRET_KEY, l'appel d'initiation
# échouera simplement à l'exécution — les autres moyens de paiement restent inchangés.
flutterwave.secret-key=${FLW_SECRET_KEY:}
flutterwave.webhook-secret-hash=${FLW_WEBHOOK_SECRET_HASH:}
flutterwave.base-url=${FLW_BASE_URL:https://api.flutterwave.com/v3}

# URLs publiques utilisées pour construire les liens de redirection (checkout Flutterwave -> backend -> frontend,
# et retour du flux OAuth2 Google/Facebook, voir OAuth2AuthenticationSuccessHandler)
app.frontend-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.backend-url=${BACKEND_BASE_URL:http://localhost:8080}

# Connexion Google/Facebook (voir SecurityConfiguration#clientRegistrationRepository) : credentials à
# créer sur Google Cloud Console (console.cloud.google.com > API et services > Identifiants) et Meta
# for Developers (developers.facebook.com > mon app > Facebook Login). Sans ces variables, l'app démarre
# normalement mais les boutons "Continuer avec Google/Facebook" échouent (aucun provider enregistré).
# URI de redirection à déclarer côté provider : {BACKEND_BASE_URL}/login/oauth2/code/google (resp. facebook).
# GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / FACEBOOK_CLIENT_ID / FACEBOOK_CLIENT_SECRET sont lus
# directement par SecurityConfiguration, pas besoin de les redéclarer ici.

# Purge automatique des notifications déjà lues (voir NotificationCleanupScheduler) :
# nombre de jours après la création d'une notification lue avant sa suppression définitive.
notification.read-retention-days=${NOTIFICATION_READ_RETENTION_DAYS:5}
