spring.application.name=billboard

# JWT (surchargeable via variables d'environnement / .env : JWT_SECRET, JWT_EXPIRATION_MS)
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-key-change-me-please-32bytes-min}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Origines autorisées à appeler l'API depuis un navigateur (le frontend Next.js tourne sur :3000)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Datasource MySQL (surchargeable via DB_URL, DB_USERNAME, DB_PASSWORD)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/billboard?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway est la source de vérité du schéma : Hibernate ne doit ni le générer ni le valider
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Mail SMTP (surchargeable via MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD)
# Valeurs par défaut adaptées à un capteur SMTP local de dev (ex. MailHog) sans authentification
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
mail.from=${MAIL_FROM:no-reply@billboard.local}

# MinIO (surchargeable via MINIO_ENDPOINT, MINIO_ACCESS_KEY, MINIO_SECRET_KEY, MINIO_BUCKET, MINIO_PUBLIC_URL)
storage.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
storage.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
storage.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
storage.minio.bucket-name=${MINIO_BUCKET:billboard}
storage.minio.public-url=${MINIO_PUBLIC_URL:http://localhost:9000/billboard/}
